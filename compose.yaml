services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keibi}
      POSTGRES_USER: ${POSTGRES_USER:-keibi}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-keibi_app}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    secrets:
      - postgres_admin_password
      - postgres_app_password
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: ["node", "scripts/database.mjs"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-keibi}
      POSTGRES_USER: ${POSTGRES_USER:-keibi}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-keibi_app}
      POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    volumes:
      - ./apps/backend/migrations:/app/apps/backend/migrations:ro
      - ./scripts/database.mjs:/app/scripts/database.mjs:ro
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: ["npm", "run", "dev", "--workspace", "@keibi/backend"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3000"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-keibi}
      POSTGRES_USER: ${POSTGRES_USER:-keibi}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-keibi_app}
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RATE_LIMIT_POINTS: ${RATE_LIMIT_POINTS:-120}
      RATE_LIMIT_DURATION: ${RATE_LIMIT_DURATION:-60}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/api/auth/google/callback}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_app_password
    networks:
      - application
      - database
    volumes:
      - ./apps/backend/src:/app/apps/backend/src:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: ["npm", "run", "dev", "--workspace", "@keibi/frontend"]
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://backend:3000
      VITE_HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - application
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src:ro
      - ./apps/frontend/index.html:/app/apps/frontend/index.html:ro
      - ./apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:

networks:
  application:
  database:
    internal: true

secrets:
  postgres_admin_password:
    file: ./.secrets/postgres_admin_password
  postgres_app_password:
    file: ./.secrets/postgres_app_password
